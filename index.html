<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CardCraft Mini</title>

    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="card">

        <img
            class="profile-photo"
            src="https://placehold.co/150"
            alt="Profile photo"
        >

        <h1>Bryan Tagal</h1>

        <h2>Freelance Designer</h2>

        <p class="bio">
            I like making cool designs and learning new things about web development.
            I enjoy being creative and making websites look better.
        </p>

        <a class="contact-button" href="mailto:example@email.com">
            Contact Me
        </a>

        <div class="social-links">
            <a href="mailto:example@email.com" title="Email">✉️</a>
            <a href="#" title="LinkedIn">💼</a>
            <a href="#" title="Instagram">📷</a>
        </div>

    </main>

</body>
</html>
